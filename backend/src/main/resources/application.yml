server:
  port: ${PORT:8080}

spring:
  application:
    name: election-assistant
  web:
    resources:
      add-mappings: false

google:
  civic:
    api-key: ${GOOGLE_CIVIC_API_KEY:}
    base-url: https://www.googleapis.com/civicinfo/v2

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://election-assistance-8c6f6.web.app}

cache:
  election-ttl-minutes: 60
  representatives-ttl-minutes: 30
