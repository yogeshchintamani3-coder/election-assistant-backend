server:
  port: ${PORT:8080}

spring:
  application:
    name: election-assistant
  mvc:
    throw-exception-if-no-handler-found: true
  datasource:
    url: jdbc:h2:mem:electiondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

google:
  civic:
    api-key: ${GOOGLE_CIVIC_API_KEY:}
    base-url: https://www.googleapis.com/civicinfo/v2
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://election-assistance-8c6f6.web.app,http://localhost:4200}

cache:
  election-ttl-minutes: 60
  representatives-ttl-minutes: 30

jwt:
  secret: ${JWT_SECRET:default-dev-secret-key-change-in-production-must-be-at-least-256-bits-long-for-hs256}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
